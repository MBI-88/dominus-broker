definitions:
  entities.Logs:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      stage:
        type: string
      subscriber:
        type: string
    type: object
info:
  contact:
    email: ingmbi8807@gmail.com
    name: MBI
    url: https://www.pr0c0d3.com/
  description: <h3>This server is a bidirectional queue using gRCP. Manager section</h3>
  title: Dominus server
  version: 1.0.0
paths:
  /manager:
    delete:
      description: <h3>Delete all logs in the database</h3>
      responses:
        "200":
          description: 'Respose response: {message:string}'
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: 'Error response {message: error}'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      tags:
      - Manager
    get:
      description: <h3>gets all logs fron the database using page and size (required)</h3>
      parameters:
      - description: page
        in: query
        name: page
        required: true
        type: integer
      - description: size
        in: query
        name: size
        required: true
        type: integer
      responses:
        "200":
          description: Success response
          schema:
            items:
              $ref: '#/definitions/entities.Logs'
            type: array
        "404":
          description: 'Response body {message: error}'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      tags:
      - Manager
  /manager-backup:
    get:
      description: <h3>Gets all selected items from the database for making a backup</h3>
      responses:
        "200":
          description: Success response
          schema:
            items:
              $ref: '#/definitions/entities.Logs'
            type: array
        "404":
          description: Error response
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      tags:
      - Manager
  /manager-pages:
    get:
      description: <h3>Gets total pages in the database</h3>
      responses:
        "200":
          description: 'Success response: {pages:int}'
          schema:
            additionalProperties:
              type: integer
            type: object
        "404":
          description: 'Response body {message: error}'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      tags:
      - Manager
  /manager-stats:
    get:
      description: <h3>Gets all statistic from the database</h3>
      responses:
        "200":
          description: 'Success response: { avgObjSize: int,collections: int, dataSize:
            int, db: string, fsTotalSize: int, fsUsedSize: int, indexSize: int, indexes:
            int, objects: int,ok: int, scaleFactor: int, storageSize: int, totalSize:
            int, views: int}'
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 'Error response {message: error}'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      tags:
      - Manager
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: API_TOKEN
    type: apiKey
swagger: "2.0"
