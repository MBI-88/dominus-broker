services:
    
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 1s
        max_attempts: 3
    ports:
      - "9090:9090"
    networks:
      - dominus
    depends_on:
      - dominus
    labels:
      - prometheus_job=dominus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://prometheus:9090/-/ready"]
      interval: 1m
      timeout: 2s
      retries: 3

volumes:
  prometheus_data:
    driver: local
  