global:
  scrape_interval: 15s
  evaluation_interval: 15s
  body_size_limit: 50MB
  sample_limit: 2000
  target_limit: 100
  label_limit: 100
  label_name_length_limit: 1000
  label_value_length_limit: 1000
  query_log_file: query.log

scrape_configs:
  - job_name: dominus
    honor_labels: true
    static_configs:
      - targets: ['sidecar:80']
