# -----------------------------
# NETWORK
# -----------------------------
bind 0.0.0.0
protected-mode yes
port 6379
timeout 0
tcp-keepalive 300

# -----------------------------
# SECURITY
# -----------------------------
requirepass dominus

# -----------------------------
# GENERAL
# -----------------------------
daemonize no
supervised no
loglevel notice
logfile ""

databases 2

# -----------------------------
# SNAPSHOTS (PERSISTENCE)
# -----------------------------
save 900 1
save 300 10
save 60 10000

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# -----------------------------
# AOF PERSISTENCE
# -----------------------------
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no

# -----------------------------
# MEMORY MANAGEMENT
# -----------------------------
maxmemory 512mb
maxmemory-policy allkeys-lru

# -----------------------------
# PERFORMANCE
# -----------------------------
tcp-backlog 511
hz 10
dynamic-hz yes

# -----------------------------
# CLIENTS
# -----------------------------
maxclients 10000

# -----------------------------
# SLOW LOG
# -----------------------------
slowlog-log-slower-than 10000
slowlog-max-len 128