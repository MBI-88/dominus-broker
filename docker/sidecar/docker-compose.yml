services:
  sidecar:
    image: nginx:latest
    container_name: sidecar
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 1s
        max_attempts: 3
    environment:
      - NGINX_HOST=0.0.0.0
      - NGINX_PORT=80
      - NGINX_ENVSUBST_TEMPLATE_SUFFIX=.conf
    networks:
      - dominus
    depends_on:
      - dominus
