apiVersion: apps/v1
kind: Deployment
metadata:
  name: sidecar
  namespace: default
  labels:
    app: sidecar
spec:
  selector:
    matchLabels:
      app: sidecar
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: sidecar
    spec:
      containers:
        - name: sidecar
          image: nginx:latest
          resources:
            requests:
              cpu: 100m
              memory: 100Mi
            limits:
              cpu: 100m
              memory: 100Mi

          env:
            - name: NGINX_HOST
              value: 0.0.0.0
            - name: NGINX_PORT
              value: "80"
            - name: NGINX_ENVSUBST_TEMPLATE_SUFFIX
              value: ".conf"

          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: sidecar-config-volume
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf 
              readOnly: true

      volumes:
        - name: sidecar-config-volume
          configMap:
            name: sidecar-config


      restartPolicy: Always

--- 
apiVersion: v1
kind: Service
metadata:
  name: sidecar
  namespace: default
spec:
  selector:
    app: sidecar
  type: ClusterIP
  sessionAffinity: None
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 80