apiVersion: apps/v1
kind: Deployment
metadata:
  name: Dominus
  namespace: default
  labels:
    app: Dominus
spec:
  selector:
    matchLabels:
      app: Dominus
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: Dominus
    spec:
      containers:
        - name: Dominus-Cmp
          image: dominus:latest #pending
          resources:
            requests:
              cpu: 100m
              memory: 100Mi
            limits:
              cpu: 100m
              memory: 100Mi
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "wget -qO- --header=API_TOKEN $API_TOKEN http://localhost:8000/health"
            initialDelaySeconds: 60
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
            periodSeconds: 60

          env:
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: Dominus-Config
                  key: API_TOKEN

            - name: REST_PORT
              valueFrom:
                secretKeyRef:
                  name: Dominus-Config
                  key: REST_PORT

            - name: GRPC_PORT
              valueFrom:
                secretKeyRef:
                  name: Dominus-Config
                  key: GRPC_PORT

            - name: SSL_CERT
              valueFrom:
                secretKeyRef:
                  name: Dominus-Config
                  key: SSL_CERT

            - name: SSL_CA
              valueFrom:
                secretKeyRef:
                  name: Dominus-Config
                  key: SSL_CA

            - name: KEY_FILE
              valueFrom:
                secretKeyRef:
                  name: Dominus-Config
                  key: KEY_FILE

            - name: LOGS
              valueFrom:
                secretKeyRef:
                  name: Dominus-Config
                  key: LOGS

            - name: WRITE_TIMEOUT
              valueFrom:
                secretKeyRef:
                  name: Dominus-Config
                  key: WRITE_TIMEOUT

            - name: READ_TIMEOUT
              valueFrom:
                secretKeyRef:
                  name: Dominus-Config
                  key: READ_TIMEOUT

            - name: IDLE_TIMOUTLOGS
              valueFrom:
                secretKeyRef:
                  name: Dominus-Config
                  key: IDLE_TIMOUT

            - name: MAX_CONNS_PER_IP
              valueFrom:
                secretKeyRef:
                  name: Dominus-Config
                  key: MAX_CONNS_PER_IP

            - name: MAX_REQUEST_PER_CONN
              valueFrom:
                secretKeyRef:
                  name: Dominus-Config
                  key: MAX_REQUEST_PER_CONN

            - name: MAX_REQUEST_BODY_SIZE
              valueFrom:
                secretKeyRef:
                  name: Dominus-Config
                  key: MAX_REQUEST_BODY_SIZE

            - name: REDUCE_MEMORY_USAGE
              valueFrom:
                secretKeyRef:
                  name: Dominus-Config
                  key: REDUCE_MEMORY_USAGE

            - name: DISABLE_HEADER_NAMES_NORMALIZING
              valueFrom:
                secretKeyRef:
                  name: Dominus-Config
                  key: DISABLE_HEADER_NAMES_NORMALIZING

            - name: SLEEP_WHEN_CONCURRENCY_LIMIT_EXCEDEED
              valueFrom:
                secretKeyRef:
                  name: Dominus-Config
                  key: SLEEP_WHEN_CONCURRENCY_LIMIT_EXCEDEED

            - name: NO_DEFAULT_DATE
              valueFrom:
                secretKeyRef:
                  name: Dominus-Config
                  key: NO_DEFAULT_DATE

            - name: KEEP_HIJACKED_CONNS
              valueFrom:
                secretKeyRef:
                  name: Dominus-Config
                  key: KEEP_HIJACKED_CONNS

            - name: CLOSE_ON_SHUTDOWN
              valueFrom:
                secretKeyRef:
                  name: Dominus-Config
                  key: CLOSE_ON_SHUTDOWN

            - name: STREAM_REQUEST_BODY
              valueFrom:
                secretKeyRef:
                  name: Dominus-Config
                  key: STREAM_REQUEST_BODY

            - name: DSN
              valueFrom:
                secretKeyRef:
                  name: Dominus-Config
                  key: DSN

            - name: CIDR
              valueFrom:
                secretKeyRef:
                  name: Dominus-Config
                  key: CIDR

            - name: DATABASE
              valueFrom:
                secretKeyRef:
                  name: Dominus-Config
                  key: DATABASE

            - name: COLLECTIONS
              valueFrom:
                secretKeyRef:
                  name: Dominus-Config
                  key: COLLECTIONS

          ports:
            - containerPort: 8000
              name: Rest
            - containerPort: 5000
              name: gRPC

      volumes:
        - name: dominus-certs
          persistentVolumeClaim:
            claimName: dominus-certs-pvc
        - name: dominus-logs
          persistentVolumeClaim:
            claimName: dominus-logs-pvc

      restartPolicy: "OnFailure"

---
apiVersion: v1
kind: Service
metadata:
  name: dominus-service
  namespace: default
spec:
  selector:
    app: Dominus
  sessionAffinity: None
  type: ClusterIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  ports:
    - name: Rest
      protocol: TCP
      port: 8000
      targetPort: 8000
    - name: gRPC
      protocol: TCP
      port: 5000
      targetPort: 5000
