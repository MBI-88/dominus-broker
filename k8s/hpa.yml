apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-group
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dominus
  minReplicas: 1
  maxReplicas: 2
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
  - type: Resource 
    resource:
      name: memory 
      target: 
        type: AverageValue 
        averageValue: 200Mi

