apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-network
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000

          - path: /manager
            pathType: Prefix 
            backend:
              service:
                name: dominus-rest
                port:
                  number: 8000