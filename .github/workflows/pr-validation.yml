name: PR Validation

on:
  pull_request:
    branches: [ master ]

permissions:
  contents: write
  pull-requests: write

env:
  GO_VERSION: "1.26.1"
  COVERAGE_THRESHOLD: "91"
  GOPRIVATE: github.com/MBI-88/*

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure git for private modules
        run: |
          git config --global url."https://${{ secrets.PROTO_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "${{ env.GO_VERSION }}"

      - name: Download dependencies
        run: go mod tidy

      - name: Run tests with coverage
        run: |
          PACKAGES=$(go list ./... | grep -vE '/cmd/|/mocks/|/internal/boostrap' | tr '\n' ' ')

          go test -race -count=1 $PAGKAGES \
            -covermode=atomic \
            -coverprofile=coverage.out

      - name: Calculate coverage
        id: coverage
        run: |
          if [ ! -f coverage.out ]; then
            echo "❌ coverage.out not found"
            exit 1
          fi

          TOTAL=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')

          if [ -z "$TOTAL" ]; then
            echo "❌ Failed to extract coverage"
            go tool cover -func=coverage.out
            exit 1
          fi

          echo "Total coverage: $TOTAL%"
          echo "coverage=$TOTAL" >> $GITHUB_OUTPUT

      - name: Validate coverage threshold
        run: |
          COVERAGE=${{ steps.coverage.outputs.coverage }}
          THRESHOLD=${{ env.COVERAGE_THRESHOLD }}

          echo "Coverage: $COVERAGE% (threshold: $THRESHOLD%)"

          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "❌ Coverage below threshold"
            exit 1
          fi

      - name: Comment PR with coverage
        uses: actions/github-script@v7
        with:
          script: |
            const coverage = "${{ steps.coverage.outputs.coverage }}";
            const body = `🧪 **Test Coverage Report**

            - Coverage: **${coverage}%**
            - Required: **${process.env.COVERAGE_THRESHOLD}%**

            ${coverage >= process.env.COVERAGE_THRESHOLD
              ? "✅ Coverage requirement met"
              : "❌ Coverage requirement NOT met"}
            `;

            github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Run go fmt
        run: go fmt ./...

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m
