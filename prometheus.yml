global:
  scrape_interval: 5s
  evaluation_interval: 5s
  body_size_limit: 15MB
  sample_limit: 1500
  target_limit: 30
  label_limit: 30
  label_name_length_limit: 200
  label_value_length_limit: 200
  query_log_file: query.log

scrape_configs:
  - job_name: dominus
    honor_labels: true
    static_configs:
      - targets: ['sidecar:80']

